{% extends "merchant/base.html" %}
{% block title %}手動建立代收訂單{% endblock %}
{% block content %}
<h1>手動建立代收訂單</h1>
{% if error %}<div class="flash">❌ {{ error }}</div>{% endif %}
<div class="card form-card">
<form method="post" class="form-grid">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="f-mc">商戶</label>
  <input id="f-mc" value="{{ mc.client_sid }} {{ mc.login_name }}" disabled>
  <label for="f-payer">玩家姓名</label>
  <input id="f-payer" name="payer" value="{{ form.payer }}" required maxlength="15">
  <label for="f-code">轉出銀行代碼</label>
  <input id="f-code" name="bank_code" value="{{ form.bank_code }}" required maxlength="3" inputmode="numeric" placeholder="例如 822">
  <label for="f-no">轉出帳號</label>
  <input id="f-no" name="bank_no" value="{{ form.bank_no }}" required maxlength="30" inputmode="numeric">
  <label for="f-amount">金額</label>
  <input id="f-amount" name="amount" value="{{ form.amount }}" required inputmode="decimal">
  <span></span>
  <p class="muted hint">建立後會顯示收款帳戶和收銀台網址，玩家必須從上面這個本人帳戶轉帳。</p>
  <span></span>
  <div class="actions"><button type="submit">新增</button></div>
</form>
</div>
{% endblock %}
