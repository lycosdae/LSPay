{% extends "merchant/base.html" %}
{% block title %}手動建立代收訂單{% endblock %}
{% block content %}
<h1>手動建立代收訂單</h1>
{% if error %}<div class="flash">❌ {{ error }}</div>{% endif %}
<div class="card" style="max-width:560px">
<form method="post" class="stack-form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>商戶<input value="{{ mc.client_sid }} {{ mc.login_name }}" disabled></label>
  <label>玩家姓名<input name="payer" value="{{ form.payer }}" required maxlength="15"></label>
  <label>玩家轉出銀行代碼<input name="bank_code" value="{{ form.bank_code }}" required maxlength="3" inputmode="numeric" placeholder="例如 822"></label>
  <label>玩家轉出帳號<input name="bank_no" value="{{ form.bank_no }}" required maxlength="30" inputmode="numeric"></label>
  <label>金額<input name="amount" value="{{ form.amount }}" required inputmode="decimal"></label>
  <p class="muted" style="margin:0">建立後會顯示收款帳戶和收銀台網址，玩家必須從上面這個本人帳戶轉帳。</p>
  <div><button type="submit">新增</button></div>
</form>
</div>
{% endblock %}
