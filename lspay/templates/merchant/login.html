<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>商戶後台登入 · LSPay</title><link rel="stylesheet" href="/static/style.css?v={{ static_v }}"></head>
<body>
<div class="login card">
  <h1>LSPay 商戶後台</h1>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="post" action="{{ mp }}/login">
    <input name="username" placeholder="商戶帳號" autocomplete="username" required>
    <input name="password" type="password" placeholder="密碼" autocomplete="current-password" required>
    <button type="submit" style="width:100%">登入</button>
  </form>
</div>
</body>
</html>
