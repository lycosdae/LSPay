{% extends "merchant/base.html" %}
{% block title %}手動建立付款訂單{% endblock %}
{% block content %}
<h1>手動建立付款訂單</h1>
{% if error %}<div class="flash">❌ {{ error }}</div>{% endif %}
<div class="card form-card">
<form method="post" class="form-grid" onsubmit="return confirm('確認建立這筆付款訂單？金額會先從可動用餘額凍結。')">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="f-mc">商戶</label>
  <input id="f-mc" value="{{ mc.client_sid }} {{ mc.login_name }}" disabled>
  <label for="f-payer">玩家姓名</label>
  <input id="f-payer" name="payer" value="{{ form.payer }}" required maxlength="15">
  <label for="f-bank">銀行</label>
  <input id="f-bank" name="bank_name" value="{{ form.bank_name }}" required maxlength="20" placeholder="例如 永豐 或 807">
  <label for="f-title">戶名</label>
  <input id="f-title" name="bank_title" value="{{ form.bank_title }}" required maxlength="20">
  <label for="f-no">帳號</label>
  <input id="f-no" name="bank_no" value="{{ form.bank_no }}" required maxlength="30" inputmode="numeric">
  <label for="f-amount">金額</label>
  <input id="f-amount" name="amount" value="{{ form.amount }}" required inputmode="decimal">
  <span></span>
  <p class="muted hint">可動用餘額：{{ money(mc.available_balance) }}</p>
  <span></span>
  <div class="actions"><button type="submit">新增</button></div>
</form>
</div>
{% endblock %}
