<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · LSPay</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="login card">
  <h1>LSPay 後台登入</h1>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  <form method="post" action="{{ admin }}/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input name="username" placeholder="帳號" autocomplete="username" required>
    <input name="password" type="password" placeholder="密碼" autocomplete="current-password" required>
    <button type="submit" style="width:100%">登入</button>
  </form>
</div>
</body>
</html>
