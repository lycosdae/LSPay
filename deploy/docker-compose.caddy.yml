# Adds a Caddy reverse proxy in front of the app (HTTPS when SITE_ADDRESS is a domain).
# Used by deploy/install.sh:  docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
